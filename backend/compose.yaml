services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: serviceevidence
      POSTGRES_USER: serviceevidence
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U serviceevidence"]
      interval: 5s
      timeout: 3s
      retries: 15
  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/serviceevidence
      DB_USERNAME: serviceevidence
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      SERVICEEVIDENCE_STORAGE_PATH: /app/private-evidence
    ports:
      - "8080:8080"
    volumes:
      - evidence:/app/private-evidence
volumes:
  pgdata:
  evidence:
