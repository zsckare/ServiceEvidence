spring:
  config:
    import: "optional:file:../.env[.properties]"
  application:
    name: service-evidence
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/serviceevidence}
    username: ${DB_USERNAME:serviceevidence}
    password: ${DB_PASSWORD:serviceevidence_dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
server:
  error:
    include-message: never

security:
  jwt:
    secret: ${JWT_SECRET}
    access-minutes: 15
    refresh-days: 14
bootstrap:
  admin:
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}

serviceevidence:
  storage:
    path: ${SERVICEEVIDENCE_STORAGE_PATH:./private-evidence}
spring.servlet.multipart.max-file-size: 20MB
spring.servlet.multipart.max-request-size: 21MB
