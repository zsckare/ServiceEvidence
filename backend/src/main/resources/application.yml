spring:
  application:
    name: service-evidence
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/serviceevidence}
    username: ${DB_USERNAME:serviceevidence}
    password: ${DB_PASSWORD:serviceevidence_dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
server:
  error:
    include-message: never
