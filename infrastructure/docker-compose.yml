services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-serviceevidence}
      POSTGRES_USER: ${DB_USERNAME:-serviceevidence}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - serviceevidence_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-serviceevidence} -d ${DB_NAME:-serviceevidence}"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  serviceevidence_pgdata:
